<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #1e1e1e;
    --border: #242424;
    --border2: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --dim: #555;
    --dimmer: #333;
    --blue: #4a9eff;
    --green: #52c97a;
    --amber: #f0a830;
    --purple: #c97adb;
    --red: #e05252;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
    font-size: 14px;
    line-height: 1.5;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .header-inner { max-width: 520px; margin: 0 auto; }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .header-title-block .eyebrow {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 3px;
  }

  .header-title-block h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-nav button {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .date-nav button:hover { border-color: var(--dim); color: var(--text); }

  .date-label {
    font-size: 12px;
    color: var(--muted);
    min-width: 90px;
    text-align: center;
  }

  .date-label.today { color: var(--blue); font-weight: 600; }

  /* MACRO BARS */
  .macro-bars { display: flex; flex-direction: column; gap: 9px; }

  .macro-row { display: flex; flex-direction: column; gap: 4px; }

  .macro-row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .macro-label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .macro-value {
    font-size: 12px;
    font-weight: 600;
  }

  .macro-value .target { color: var(--dim); font-weight: 400; }

  .bar-track {
    background: var(--surface2);
    border-radius: 3px;
    height: 6px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.35s ease;
  }

  /* REMAINING */
  .remaining {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .remaining-card {
    flex: 1;
    background: var(--surface2);
    border-radius: 6px;
    padding: 9px 12px;
    border-left: 3px solid var(--border2);
  }

  .remaining-card.over { border-left-color: var(--red); }
  .remaining-card.low { border-left-color: var(--amber); }

  .remaining-card .rc-label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .remaining-card .rc-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
  }

  .remaining-card .rc-value.over { color: var(--red); }
  .remaining-card .rc-value.low { color: var(--amber); }
  .remaining-card .rc-tag {
    font-size: 10px;
    color: var(--red);
    margin-left: 4px;
  }

  /* MAIN */
  .main { max-width: 520px; margin: 0 auto; padding: 14px 16px 0; }

  .error-banner {
    background: #2a1a1a;
    border: 1px solid #5a2a2a;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--red);
  }

  /* MEAL CARDS */
  .meal-card {
    background: var(--surface);
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .meal-header {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }

  .meal-header:hover { background: #1c1c1c; }

  .meal-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .meal-name { font-size: 15px; font-weight: 600; }

  .meal-badge {
    font-size: 11px;
    color: var(--dim);
    background: #222;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .meal-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .meal-summary { font-size: 13px; color: var(--muted); }
  .meal-summary .prot { color: var(--green); }

  .chevron { color: var(--dimmer); font-size: 10px; }

  .meal-body {
    border-top: 1px solid var(--border);
    padding: 12px 16px 16px;
  }

  /* ENTRIES */
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--surface2);
  }

  .entry-name { font-size: 13px; font-weight: 500; }

  .entry-macros {
    font-size: 11px;
    color: var(--dim);
    margin-top: 2px;
  }

  .entry-remove {
    background: none;
    border: none;
    color: var(--dimmer);
    cursor: pointer;
    font-size: 18px;
    padding: 0 4px;
    line-height: 1;
    flex-shrink: 0;
  }

  .entry-remove:hover { color: var(--red); }

  /* INPUT ROW */
  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .food-input {
    flex: 1;
    background: #111;
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }

  .food-input:focus { border-color: var(--blue); }
  .food-input::placeholder { color: var(--dimmer); }

  .add-btn {
    background: var(--blue);
    border: none;
    border-radius: 6px;
    color: #fff;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    min-width: 64px;
  }

  .add-btn:disabled {
    background: var(--surface2);
    color: var(--dimmer);
    cursor: not-allowed;
  }

  .input-hint { font-size: 11px; color: var(--dimmer); margin-top: 6px; }

  /* HISTORY TAB */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    background: none;
    border: none;
    color: var(--dim);
    font-size: 13px;
    font-family: inherit;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tab.active { color: var(--text); border-bottom-color: var(--blue); }

  /* HISTORY */
  .history-day {
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .history-day-header {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .history-day-header:hover { background: #1c1c1c; }

  .history-date { font-size: 14px; font-weight: 600; }

  .history-totals { font-size: 12px; color: var(--muted); }
  .history-totals .hp { color: var(--green); }

  .history-entries { border-top: 1px solid var(--border); }

  .history-meal-group { padding: 10px 16px; border-bottom: 1px solid var(--surface2); }
  .history-meal-group:last-child { border-bottom: none; }
  .history-meal-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

  .history-entry { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .history-entry span { color: var(--dim); }

  .empty-history {
    text-align: center;
    color: var(--dim);
    padding: 40px 16px;
    font-size: 13px;
  }

  /* CLEAR BTN */
  .clear-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--dim);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: inherit;
  }

  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  @media (max-width: 400px) {
    .header { padding: 14px 12px 14px; }
    .main { padding: 12px 12px 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="header-title-block">
        <div class="eyebrow">Due Season</div>
        <h1>Macro Tracker</h1>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div class="date-nav">
          <button onclick="changeDay(-1)">&#8592;</button>
          <div class="date-label" id="date-label"></div>
          <button onclick="changeDay(1)" id="next-btn">&#8594;</button>
        </div>
        <button class="clear-btn" onclick="clearCurrentDay()">Clear day</button>
      </div>
    </div>

    <div class="macro-bars" id="macro-bars"></div>
    <div class="remaining" id="remaining"></div>
  </div>
</div>

<div class="main">
  <div id="error-banner" class="error-banner" style="display:none;"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('today', this)">Today</button>
    <button class="tab" onclick="switchTab('history', this)">History</button>
  </div>

  <div id="today-view"></div>
  <div id="history-view" style="display:none;"></div>
</div>

<script>
const TARGETS = { calories: 1850, protein: 190, carbs: 150, fat: 70 };
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
const STORAGE_KEY = 'macro_tracker_v1';

let currentDateOffset = 0; // 0 = today, -1 = yesterday, etc.
let expandedMeals = new Set(['Breakfast']);
let expandedHistoryDays = new Set();
let loadingMeals = new Set();
let currentTab = 'today';

// ---- Storage ----
function getStorage() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveStorage(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function dateKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function getDayLog(offset = 0) {
  const storage = getStorage();
  const key = dateKey(offset);
  if (!storage[key]) {
    storage[key] = MEALS.map(m => ({ meal: m, entries: [] }));
    saveStorage(storage);
  }
  return storage[key];
}

function saveDayLog(log, offset = 0) {
  const storage = getStorage();
  storage[dateKey(offset)] = log;
  saveStorage(storage);
}

// ---- Date helpers ----
function formatDateLabel(offset) {
  if (offset === 0) return 'Today';
  if (offset === -1) return 'Yesterday';
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateFull(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const today = dateKey(0);
  const yesterday = dateKey(-1);
  if (dateStr === today) return 'Today';
  if (dateStr === yesterday) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

// ---- Totals ----
function calcTotals(log) {
  return log.reduce((acc, { entries }) => {
    entries.forEach(e => {
      acc.calories += e.calories || 0;
      acc.protein += e.protein || 0;
      acc.carbs += e.carbs || 0;
      acc.fat += e.fat || 0;
    });
    return acc;
  }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

function calcMealTotals(entries) {
  return entries.reduce((acc, e) => ({
    calories: acc.calories + (e.calories || 0),
    protein: acc.protein + (e.protein || 0),
    carbs: acc.carbs + (e.carbs || 0),
    fat: acc.fat + (e.fat || 0),
  }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

// ---- AI Parsing ----
async function parseFoodWithAI(description, meal) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: `You are a nutrition database. The user ate the following for ${meal}: "${description}"

Parse this into individual food items and estimate the nutrition for each.

Respond ONLY with a JSON array, no markdown, no preamble. Format:
[
  { "name": "Food name", "calories": 123, "protein": 12, "carbs": 15, "fat": 6 },
  ...
]

Be realistic with estimates. Use common serving sizes if not specified.`
      }]
    })
  });
  if (!response.ok) throw new Error('API error');
  const data = await response.json();
  const text = (data.content || []).find(b => b.type === 'text')?.text || '[]';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ---- Render Header ----
function renderHeader() {
  const log = getDayLog(currentDateOffset);
  const totals = calcTotals(log);

  // Date label
  const label = document.getElementById('date-label');
  label.textContent = formatDateLabel(currentDateOffset);
  label.className = 'date-label' + (currentDateOffset === 0 ? ' today' : '');

  // Disable next if today
  document.getElementById('next-btn').disabled = currentDateOffset >= 0;

  // Macro bars
  const bars = [
    { key: 'calories', label: 'Calories', color: '#4a9eff', unit: '' },
    { key: 'protein', label: 'Protein', color: '#52c97a', unit: 'g' },
    { key: 'carbs', label: 'Carbs', color: '#f0a830', unit: 'g' },
    { key: 'fat', label: 'Fat', color: '#c97adb', unit: 'g' },
  ];

  document.getElementById('macro-bars').innerHTML = bars.map(({ key, label, color, unit }) => {
    const val = Math.round(totals[key]);
    const target = TARGETS[key];
    const pct = Math.min((val / target) * 100, 100);
    const over = val > target;
    return `
      <div class="macro-row">
        <div class="macro-row-top">
          <span class="macro-label">${label}</span>
          <span class="macro-value" style="color:${over ? 'var(--red)' : 'var(--text)'}">${val}<span class="target">/${target}${unit}</span></span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${over ? 'var(--red)' : color};"></div>
        </div>
      </div>`;
  }).join('');

  // Remaining
  const remCal = TARGETS.calories - Math.round(totals.calories);
  const remProt = TARGETS.protein - Math.round(totals.protein);

  document.getElementById('remaining').innerHTML = [
    { label: 'Calories left', value: remCal, unit: '' },
    { label: 'Protein left', value: remProt, unit: 'g' },
  ].map(({ label, value, unit }) => {
    const over = value < 0;
    const low = !over && value < 100;
    return `
      <div class="remaining-card ${over ? 'over' : low ? 'low' : ''}">
        <div class="rc-label">${label}</div>
        <div class="rc-value ${over ? 'over' : low ? 'low' : ''}">
          ${over ? '+' + Math.abs(value) : value}${unit}
          ${over ? '<span class="rc-tag">over</span>' : ''}
        </div>
      </div>`;
  }).join('');
}

// ---- Render Today ----
function renderToday() {
  const log = getDayLog(currentDateOffset);
  const view = document.getElementById('today-view');

  view.innerHTML = log.map(({ meal, entries }) => {
    const isOpen = expandedMeals.has(meal);
    const mt = calcMealTotals(entries);
    const isLoading = loadingMeals.has(meal);

    const entriesHtml = entries.map((entry, idx) => `
      <div class="entry">
        <div>
          <div class="entry-name">${escHtml(entry.name)}</div>
          <div class="entry-macros">${Math.round(entry.calories)} cal &middot; ${Math.round(entry.protein)}g P &middot; ${Math.round(entry.carbs)}g C &middot; ${Math.round(entry.fat)}g F</div>
        </div>
        <button class="entry-remove" onclick="removeEntry('${escAttr(meal)}', ${idx})">&#215;</button>
      </div>`).join('');

    return `
      <div class="meal-card">
        <div class="meal-header" onclick="toggleMeal('${escAttr(meal)}')">
          <div class="meal-header-left">
            <span class="meal-name">${meal}</span>
            ${entries.length > 0 ? `<span class="meal-badge">${entries.length} item${entries.length !== 1 ? 's' : ''}</span>` : ''}
          </div>
          <div class="meal-header-right">
            ${entries.length > 0 ? `<span class="meal-summary">${Math.round(mt.calories)} cal &middot; <span class="prot">${Math.round(mt.protein)}g P</span></span>` : ''}
            <span class="chevron">${isOpen ? '▲' : '▼'}</span>
          </div>
        </div>
        ${isOpen ? `
        <div class="meal-body">
          ${entriesHtml}
          <div class="input-row">
            <input
              class="food-input"
              id="input-${escAttr(meal)}"
              type="text"
              placeholder="Describe what you ate..."
              ${isLoading ? 'disabled' : ''}
              onkeydown="if(event.key==='Enter') addFood('${escAttr(meal)}')"
            />
            <button class="add-btn" onclick="addFood('${escAttr(meal)}')" ${isLoading || '' ? '' : ''} id="btn-${escAttr(meal)}">
              ${isLoading ? '...' : 'Add'}
            </button>
          </div>
          <div class="input-hint">e.g. "3 fried eggs, biscuit with butter and jelly, glass of milk"</div>
        </div>` : ''}
      </div>`;
  }).join('');
}

// ---- Render History ----
function renderHistory() {
  const storage = getStorage();
  const today = dateKey(0);
  const keys = Object.keys(storage)
    .filter(k => k !== today)
    .sort((a, b) => b.localeCompare(a))
    .slice(0, 30);

  const view = document.getElementById('history-view');

  if (keys.length === 0) {
    view.innerHTML = '<div class="empty-history">No history yet. Start logging today.</div>';
    return;
  }

  view.innerHTML = keys.map(key => {
    const log = storage[key];
    const totals = calcTotals(log);
    const isOpen = expandedHistoryDays.has(key);
    const hasEntries = log.some(m => m.entries.length > 0);

    const mealsHtml = log.filter(m => m.entries.length > 0).map(({ meal, entries }) => `
      <div class="history-meal-group">
        <div class="history-meal-label">${meal}</div>
        ${entries.map(e => `
          <div class="history-entry">${escHtml(e.name)} <span>&mdash; ${Math.round(e.calories)} cal, ${Math.round(e.protein)}g P</span></div>
        `).join('')}
      </div>`).join('');

    return `
      <div class="history-day">
        <div class="history-day-header" onclick="toggleHistoryDay('${key}')">
          <span class="history-date">${formatDateFull(key)}</span>
          <span class="history-totals">${Math.round(totals.calories)} cal &middot; <span class="hp">${Math.round(totals.protein)}g P</span></span>
        </div>
        ${isOpen && hasEntries ? `<div class="history-entries">${mealsHtml}</div>` : ''}
      </div>`;
  }).join('');
}

// ---- Actions ----
function toggleMeal(meal) {
  if (expandedMeals.has(meal)) expandedMeals.delete(meal);
  else expandedMeals.add(meal);
  renderToday();
}

function toggleHistoryDay(key) {
  if (expandedHistoryDays.has(key)) expandedHistoryDays.delete(key);
  else expandedHistoryDays.add(key);
  renderHistory();
}

function changeDay(delta) {
  const newOffset = currentDateOffset + delta;
  if (newOffset > 0) return;
  currentDateOffset = newOffset;
  renderAll();
}

function clearCurrentDay() {
  if (!confirm('Clear all entries for ' + formatDateLabel(currentDateOffset) + '?')) return;
  saveDayLog(MEALS.map(m => ({ meal: m, entries: [] })), currentDateOffset);
  renderAll();
}

async function addFood(meal) {
  const input = document.getElementById('input-' + meal);
  if (!input) return;
  const desc = input.value.trim();
  if (!desc) return;

  loadingMeals.add(meal);
  hideError();
  renderToday();

  try {
    const items = await parseFoodWithAI(desc, meal);
    const log = getDayLog(currentDateOffset);
    const mealLog = log.find(m => m.meal === meal);
    if (mealLog) mealLog.entries.push(...items);
    saveDayLog(log, currentDateOffset);
  } catch (e) {
    showError("Couldn't parse that — try being a bit more specific, or check your connection.");
  } finally {
    loadingMeals.delete(meal);
    renderAll();
  }
}

function removeEntry(meal, idx) {
  const log = getDayLog(currentDateOffset);
  const mealLog = log.find(m => m.meal === meal);
  if (mealLog) mealLog.entries.splice(idx, 1);
  saveDayLog(log, currentDateOffset);
  renderAll();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('today-view').style.display = tab === 'today' ? '' : 'none';
  document.getElementById('history-view').style.display = tab === 'history' ? '' : 'none';
  if (tab === 'history') renderHistory();
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = '';
}

function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(str) {
  return String(str).replace(/'/g,"\\'");
}

// ---- Init ----
function renderAll() {
  renderHeader();
  if (currentTab === 'today') renderToday();
  else renderHistory();
}

renderAll();
</script>
</body>
</html>
