<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #181818; --surface2: #1e1e1e;
    --border: #242424; --border2: #2e2e2e; --text: #f0f0f0;
    --muted: #888; --dim: #555; --dimmer: #333;
    --blue: #4a9eff; --green: #52c97a; --amber: #f0a830;
    --purple: #c97adb; --red: #e05252;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; min-height: 100vh; padding-bottom: 80px; font-size: 14px; line-height: 1.5; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 16px 16px; position: sticky; top: 0; z-index: 20; }
  .header-inner { max-width: 520px; margin: 0 auto; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .eyebrow { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button { background: none; border: 1px solid var(--border2); color: var(--muted); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .date-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
  .date-label { font-size: 12px; color: var(--muted); min-width: 80px; text-align: center; }
  .date-label.today { color: var(--blue); font-weight: 600; }
  .macro-bars { display: flex; flex-direction: column; gap: 9px; }
  .macro-row { display: flex; flex-direction: column; gap: 4px; }
  .macro-row-top { display: flex; justify-content: space-between; }
  .macro-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .macro-value { font-size: 12px; font-weight: 600; }
  .macro-value .target { color: var(--dim); font-weight: 400; }
  .bar-track { background: var(--surface2); border-radius: 3px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.35s ease; }
  .remaining { display: flex; gap: 10px; margin-top: 14px; }
  .remaining-card { flex: 1; background: var(--surface2); border-radius: 6px; padding: 9px 12px; border-left: 3px solid var(--border2); }
  .remaining-card.over { border-left-color: var(--red); }
  .remaining-card.low { border-left-color: var(--amber); }
  .rc-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
  .rc-value { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .rc-value.over { color: var(--red); }
  .rc-value.low { color: var(--amber); }
  .rc-tag { font-size: 10px; color: var(--red); margin-left: 4px; }
  .main { max-width: 520px; margin: 0 auto; padding: 14px 16px 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tab { background: none; border: none; color: var(--dim); font-size: 13px; font-family: inherit; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--blue); }
  .meal-card { background: var(--surface); border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); overflow: hidden; }
  .meal-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  .meal-header:hover { background: #1c1c1c; }
  .meal-header-left { display: flex; align-items: center; gap: 10px; }
  .meal-name { font-size: 15px; font-weight: 600; }
  .meal-badge { font-size: 11px; color: var(--dim); background: #222; padding: 2px 8px; border-radius: 10px; }
  .meal-header-right { display: flex; align-items: center; gap: 12px; }
  .meal-summary { font-size: 13px; color: var(--muted); }
  .meal-summary .prot { color: var(--green); }
  .chevron { color: var(--dimmer); font-size: 10px; }
  .meal-body { border-top: 1px solid var(--border); padding: 12px 16px 16px; }
  .entry { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--surface2); }
  .entry-name { font-size: 13px; font-weight: 500; }
  .entry-macros { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .entry-remove { background: none; border: none; color: var(--dimmer); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .entry-remove:hover { color: var(--red); }

  /* SEARCH UI */
  .search-wrap { position: relative; margin-top: 12px; }
  .search-input { width: 100%; background: #111; border: 1px solid var(--border2); border-radius: 6px; color: var(--text); padding: 10px 12px; font-size: 13px; outline: none; font-family: inherit; }
  .search-input:focus { border-color: var(--blue); }
  .search-input::placeholder { color: var(--dimmer); }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1px solid var(--border2); border-radius: 6px; margin-top: 4px; max-height: 260px; overflow-y: auto; z-index: 100; }
  .search-result { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: var(--surface2); }
  .sr-name { font-size: 13px; font-weight: 500; }
  .sr-macros { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .sr-serving { font-size: 11px; color: var(--blue); margin-top: 1px; }
  .no-results { padding: 12px; font-size: 13px; color: var(--dim); text-align: center; }

  /* MANUAL ENTRY */
  .manual-toggle { font-size: 12px; color: var(--blue); cursor: pointer; margin-top: 8px; display: inline-block; }
  .manual-form { background: var(--surface2); border-radius: 6px; padding: 12px; margin-top: 8px; }
  .manual-form-title { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .manual-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .manual-input { flex: 1; background: #111; border: 1px solid var(--border2); border-radius: 5px; color: var(--text); padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none; }
  .manual-input:focus { border-color: var(--blue); }
  .manual-input::placeholder { color: var(--dimmer); font-size: 11px; }
  .manual-macros { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .add-manual-btn { background: var(--green); border: none; border-radius: 5px; color: #000; font-size: 12px; font-weight: 700; padding: 8px 14px; cursor: pointer; font-family: inherit; }

  /* SERVING SELECTOR */
  .serving-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
  .serving-modal { background: var(--surface); border-radius: 12px 12px 0 0; padding: 20px 16px 32px; width: 100%; max-width: 520px; }
  .sm-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .sm-macros { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .sm-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sm-label { font-size: 13px; color: var(--muted); width: 80px; flex-shrink: 0; }
  .sm-input { flex: 1; background: #111; border: 1px solid var(--border2); border-radius: 6px; color: var(--text); padding: 10px 12px; font-size: 15px; font-family: inherit; outline: none; text-align: center; }
  .sm-input:focus { border-color: var(--blue); }
  .sm-preview { background: var(--surface2); border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; display: flex; justify-content: space-between; }
  .sm-preview-item { text-align: center; }
  .sm-preview-val { font-size: 16px; font-weight: 700; }
  .sm-preview-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .sm-add-btn { width: 100%; background: var(--green); border: none; border-radius: 8px; color: #000; font-size: 15px; font-weight: 700; padding: 14px; cursor: pointer; font-family: inherit; }
  .sm-cancel { width: 100%; background: none; border: none; color: var(--muted); font-size: 13px; padding: 10px; cursor: pointer; font-family: inherit; margin-top: 6px; }

  /* HISTORY */
  .history-day { background: var(--surface); border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .history-day-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .history-day-header:hover { background: #1c1c1c; }
  .history-date { font-size: 14px; font-weight: 600; }
  .history-totals { font-size: 12px; color: var(--muted); }
  .history-totals .hp { color: var(--green); }
  .history-entries { border-top: 1px solid var(--border); }
  .history-meal-group { padding: 10px 16px; border-bottom: 1px solid var(--surface2); }
  .history-meal-group:last-child { border-bottom: none; }
  .history-meal-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .history-entry { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .empty-history { text-align: center; color: var(--dim); padding: 40px 16px; font-size: 13px; }
  .clear-btn { background: none; border: 1px solid var(--border2); color: var(--dim); font-size: 11px; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: inherit; }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  .input-hint { font-size: 11px; color: var(--dimmer); margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="eyebrow">Due Season</div>
        <h1>Macro Tracker</h1>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div class="date-nav">
          <button onclick="changeDay(-1)">&#8592;</button>
          <div class="date-label" id="date-label"></div>
          <button onclick="changeDay(1)" id="next-btn">&#8594;</button>
        </div>
        <button class="clear-btn" onclick="clearCurrentDay()">Clear day</button>
      </div>
    </div>
    <div class="macro-bars" id="macro-bars"></div>
    <div class="remaining" id="remaining"></div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('today',this)">Today</button>
    <button class="tab" onclick="switchTab('history',this)">History</button>
  </div>
  <div id="today-view"></div>
  <div id="history-view" style="display:none;"></div>
</div>

<!-- Serving modal -->
<div class="serving-modal-overlay" id="serving-modal" style="display:none;" onclick="closeModal(event)">
  <div class="serving-modal">
    <div class="sm-title" id="sm-food-name"></div>
    <div class="sm-macros" id="sm-food-base"></div>
    <div class="sm-row">
      <span class="sm-label">Servings</span>
      <input class="sm-input" type="number" id="sm-qty" value="1" step="0.25" min="0.25" oninput="updateModalPreview()">
    </div>
    <div class="sm-preview" id="sm-preview"></div>
    <button class="sm-add-btn" onclick="confirmAdd()">Add to log</button>
    <button class="sm-cancel" onclick="document.getElementById('serving-modal').style.display='none'">Cancel</button>
  </div>
</div>

// ================================================================
// STATE & STORAGE
// ================================================================
const TARGETS = { calories: 1850, protein: 190, carbs: 150, fat: 70 };
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
const STORAGE_KEY = 'macro_tracker_v2';

let currentDateOffset = 0;
let expandedMeals = new Set(['Breakfast']);
let expandedHistoryDays = new Set();
let currentTab = 'today';
let searchTimers = {};
let pendingFood = null; // food being configured in modal
let pendingMeal = null;
let showManual = {};

function getStorage() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveStorage(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

function dateKey(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function getDayLog(offset = 0) {
  const s = getStorage(); const k = dateKey(offset);
  if (!s[k]) { s[k] = MEALS.map(m => ({ meal: m, entries: [] })); saveStorage(s); }
  return s[k];
}
function saveDayLog(log, offset = 0) {
  const s = getStorage(); s[dateKey(offset)] = log; saveStorage(s);
}

function calcTotals(log) {
  return log.reduce((a, { entries }) => {
    entries.forEach(e => { a.calories += e.calories||0; a.protein += e.protein||0; a.carbs += e.carbs||0; a.fat += e.fat||0; });
    return a;
  }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
}
function calcMealTotals(entries) {
  return entries.reduce((a, e) => ({ calories: a.calories+(e.calories||0), protein: a.protein+(e.protein||0), carbs: a.carbs+(e.carbs||0), fat: a.fat+(e.fat||0) }), {calories:0,protein:0,carbs:0,fat:0});
}

// ================================================================
// SEARCH
// ================================================================
function searchFoods(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  const terms = q.split(' ').filter(t => t.length > 1);
  const scored = FOODS.map(f => {
    const name = f[0].toLowerCase();
    let score = 0;
    if (name === q) score += 100;
    else if (name.startsWith(q)) score += 50;
    else if (name.includes(q)) score += 30;
    terms.forEach(t => { if (name.includes(t)) score += 10; });
    return { score, food: f };
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);
  return scored.slice(0, 12).map(x => x.food);
}

// ================================================================
// RENDER HEADER
// ================================================================
function renderHeader() {
  const log = getDayLog(currentDateOffset);
  const totals = calcTotals(log);
  const label = document.getElementById('date-label');
  label.textContent = currentDateOffset === 0 ? 'Today' : currentDateOffset === -1 ? 'Yesterday' : (() => { const d = new Date(); d.setDate(d.getDate()+currentDateOffset); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); })();
  label.className = 'date-label' + (currentDateOffset === 0 ? ' today' : '');
  document.getElementById('next-btn').disabled = currentDateOffset >= 0;

  const bars = [
    {key:'calories',label:'Calories',color:'#4a9eff',unit:''},
    {key:'protein',label:'Protein',color:'#52c97a',unit:'g'},
    {key:'carbs',label:'Carbs',color:'#f0a830',unit:'g'},
    {key:'fat',label:'Fat',color:'#c97adb',unit:'g'},
  ];
  document.getElementById('macro-bars').innerHTML = bars.map(({key,label,color,unit}) => {
    const val = Math.round(totals[key]); const target = TARGETS[key];
    const pct = Math.min((val/target)*100,100); const over = val > target;
    return `<div class="macro-row"><div class="macro-row-top"><span class="macro-label">${label}</span><span class="macro-value" style="color:${over?'var(--red)':'var(--text)'}">${val}<span class="target">/${target}${unit}</span></span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${over?'var(--red)':color}"></div></div></div>`;
  }).join('');

  const remCal = TARGETS.calories - Math.round(totals.calories);
  const remProt = TARGETS.protein - Math.round(totals.protein);
  document.getElementById('remaining').innerHTML = [
    {label:'Calories left',value:remCal,unit:''},
    {label:'Protein left',value:remProt,unit:'g'}
  ].map(({label,value,unit}) => {
    const over = value < 0; const low = !over && value < 100;
    return `<div class="remaining-card ${over?'over':low?'low':''}"><div class="rc-label">${label}</div><div class="rc-value ${over?'over':low?'low':''}">${over?'+'+Math.abs(value):value}${unit}${over?'<span class="rc-tag">over</span>':''}</div></div>`;
  }).join('');
}

// ================================================================
// RENDER TODAY
// ================================================================
function renderToday() {
  const log = getDayLog(currentDateOffset);
  document.getElementById('today-view').innerHTML = log.map(({meal, entries}) => {
    const isOpen = expandedMeals.has(meal);
    const mt = calcMealTotals(entries);
    const manualVisible = showManual[meal];
    const entriesHtml = entries.map((e, idx) => `
      <div class="entry">
        <div><div class="entry-name">${esc(e.name)}</div><div class="entry-macros">${Math.round(e.calories)} cal · ${Math.round(e.protein)}g P · ${Math.round(e.carbs)}g C · ${Math.round(e.fat)}g F</div></div>
        <button class="entry-remove" onclick="removeEntry('${escA(meal)}',${idx})">×</button>
      </div>`).join('');

    return `<div class="meal-card">
      <div class="meal-header" onclick="toggleMeal('${escA(meal)}')">
        <div class="meal-header-left"><span class="meal-name">${meal}</span>${entries.length>0?`<span class="meal-badge">${entries.length} item${entries.length!==1?'s':''}</span>`:''}</div>
        <div class="meal-header-right">${entries.length>0?`<span class="meal-summary">${Math.round(mt.calories)} cal · <span class="prot">${Math.round(mt.protein)}g P</span></span>`:''}<span class="chevron">${isOpen?'▲':'▼'}</span></div>
      </div>
      ${isOpen ? `<div class="meal-body">
        ${entriesHtml}
        <div class="search-wrap">
          <input class="search-input" id="search-${escA(meal)}" type="text" placeholder="Search foods..." autocomplete="off" oninput="onSearch('${escA(meal)}')" />
          <div class="search-results" id="results-${escA(meal)}" style="display:none;"></div>
        </div>
        <span class="manual-toggle" onclick="toggleManual('${escA(meal)}')">${manualVisible?'▲ Hide manual entry':'+ Enter manually'}</span>
        ${manualVisible ? `<div class="manual-form">
          <div class="manual-form-title">Manual Entry</div>
          <div class="manual-row"><input class="manual-input" id="mname-${escA(meal)}" placeholder="Food name" type="text" style="flex:2"/></div>
          <div class="manual-macros">
            <input class="manual-input" id="mcal-${escA(meal)}" placeholder="Cal" type="number"/>
            <input class="manual-input" id="mpro-${escA(meal)}" placeholder="Protein g" type="number"/>
            <input class="manual-input" id="mcarb-${escA(meal)}" placeholder="Carbs g" type="number"/>
            <input class="manual-input" id="mfat-${escA(meal)}" placeholder="Fat g" type="number"/>
          </div>
          <button class="add-manual-btn" onclick="addManual('${escA(meal)}')">Add</button>
        </div>` : ''}
        <div class="input-hint">Search by name — e.g. "fried egg", "chicken breast", "ruffles queso"</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ================================================================
// SEARCH HANDLERS
// ================================================================
function onSearch(meal) {
  clearTimeout(searchTimers[meal]);
  searchTimers[meal] = setTimeout(() => {
    const input = document.getElementById('search-' + meal);
    const resultsEl = document.getElementById('results-' + meal);
    if (!input || !resultsEl) return;
    const q = input.value.trim();
    if (q.length < 2) { resultsEl.style.display = 'none'; return; }
    const results = searchFoods(q);
    if (results.length === 0) {
      resultsEl.innerHTML = `<div class="no-results">No match — use manual entry below</div>`;
    } else {
      resultsEl.innerHTML = results.map(f => `
        <div class="search-result" onclick="selectFood('${escA(meal)}', ${FOODS.indexOf(f)})">
          <div class="sr-name">${esc(f[0])}</div>
          <div class="sr-macros">${f[1]} cal · ${f[2]}g P · ${f[3]}g C · ${f[4]}g F</div>
          <div class="sr-serving">${esc(f[5])}</div>
        </div>`).join('');
    }
    resultsEl.style.display = 'block';
  }, 200);
}

function selectFood(meal, idx) {
  pendingFood = FOODS[idx];
  pendingMeal = meal;
  document.getElementById('sm-food-name').textContent = pendingFood[0];
  document.getElementById('sm-food-base').textContent = `Per serving (${pendingFood[5]}): ${pendingFood[1]} cal · ${pendingFood[2]}g P · ${pendingFood[3]}g C · ${pendingFood[4]}g F`;
  document.getElementById('sm-qty').value = '1';
  updateModalPreview();
  document.getElementById('serving-modal').style.display = 'flex';
  // hide results
  const r = document.getElementById('results-' + meal);
  if (r) r.style.display = 'none';
}

function updateModalPreview() {
  if (!pendingFood) return;
  const qty = parseFloat(document.getElementById('sm-qty').value) || 1;
  const preview = [
    {label:'Cal', val: Math.round(pendingFood[1]*qty)},
    {label:'Protein', val: Math.round(pendingFood[2]*qty)+'g'},
    {label:'Carbs', val: Math.round(pendingFood[3]*qty)+'g'},
    {label:'Fat', val: Math.round(pendingFood[4]*qty)+'g'},
  ];
  document.getElementById('sm-preview').innerHTML = preview.map(p => `<div class="sm-preview-item"><div class="sm-preview-val">${p.val}</div><div class="sm-preview-label">${p.label}</div></div>`).join('');
}

function confirmAdd() {
  if (!pendingFood || !pendingMeal) return;
  const qty = parseFloat(document.getElementById('sm-qty').value) || 1;
  const entry = {
    name: pendingFood[0] + (qty !== 1 ? ` (×${qty})` : ''),
    calories: Math.round(pendingFood[1]*qty),
    protein: Math.round(pendingFood[2]*qty),
    carbs: Math.round(pendingFood[3]*qty),
    fat: Math.round(pendingFood[4]*qty),
  };
  addEntryToMeal(pendingMeal, entry);
  document.getElementById('serving-modal').style.display = 'none';
  pendingFood = null; pendingMeal = null;
  // clear search
  const input = document.getElementById('search-' + pendingMeal);
  if (input) input.value = '';
}

function closeModal(e) {
  if (e.target.id === 'serving-modal') document.getElementById('serving-modal').style.display = 'none';
}

function toggleManual(meal) {
  showManual[meal] = !showManual[meal];
  renderToday();
}

function addManual(meal) {
  const name = document.getElementById('mname-' + meal)?.value.trim();
  const cal = parseFloat(document.getElementById('mcal-' + meal)?.value) || 0;
  const pro = parseFloat(document.getElementById('mpro-' + meal)?.value) || 0;
  const carb = parseFloat(document.getElementById('mcarb-' + meal)?.value) || 0;
  const fat = parseFloat(document.getElementById('mfat-' + meal)?.value) || 0;
  if (!name) return;
  addEntryToMeal(meal, { name, calories: cal, protein: pro, carbs: carb, fat });
  showManual[meal] = false;
}

function addEntryToMeal(meal, entry) {
  const log = getDayLog(currentDateOffset);
  const m = log.find(x => x.meal === meal);
  if (m) m.entries.push(entry);
  saveDayLog(log, currentDateOffset);
  renderAll();
}

function removeEntry(meal, idx) {
  const log = getDayLog(currentDateOffset);
  const m = log.find(x => x.meal === meal);
  if (m) m.entries.splice(idx, 1);
  saveDayLog(log, currentDateOffset);
  renderAll();
}

function toggleMeal(meal) {
  expandedMeals.has(meal) ? expandedMeals.delete(meal) : expandedMeals.add(meal);
  renderToday();
}

// ================================================================
// HISTORY
// ================================================================
function renderHistory() {
  const storage = getStorage();
  const today = dateKey(0);
  const keys = Object.keys(storage).filter(k => k !== today).sort((a,b) => b.localeCompare(a)).slice(0, 30);
  const view = document.getElementById('history-view');
  if (keys.length === 0) { view.innerHTML = '<div class="empty-history">No history yet.</div>'; return; }
  view.innerHTML = keys.map(key => {
    const log = storage[key];
    const totals = calcTotals(log);
    const isOpen = expandedHistoryDays.has(key);
    const d = new Date(key + 'T00:00:00');
    const label = key === dateKey(-1) ? 'Yesterday' : d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const mealsHtml = log.filter(m => m.entries.length > 0).map(({meal, entries}) => `
      <div class="history-meal-group">
        <div class="history-meal-label">${meal}</div>
        ${entries.map(e => `<div class="history-entry">${esc(e.name)} <span>— ${Math.round(e.calories)} cal, ${Math.round(e.protein)}g P</span></div>`).join('')}
      </div>`).join('');
    return `<div class="history-day">
      <div class="history-day-header" onclick="toggleHistoryDay('${key}')">
        <span class="history-date">${label}</span>
        <span class="history-totals">${Math.round(totals.calories)} cal · <span class="hp">${Math.round(totals.protein)}g P</span></span>
      </div>
      ${isOpen ? `<div class="history-entries">${mealsHtml}</div>` : ''}
    </div>`;
  }).join('');
}

function toggleHistoryDay(key) {
  expandedHistoryDays.has(key) ? expandedHistoryDays.delete(key) : expandedHistoryDays.add(key);
  renderHistory();
}

// ================================================================
// MISC
// ================================================================
function changeDay(delta) {
  const n = currentDateOffset + delta;
  if (n > 0) return;
  currentDateOffset = n;
  renderAll();
}

function clearCurrentDay() {
  const label = currentDateOffset === 0 ? 'today' : currentDateOffset === -1 ? 'yesterday' : 'this day';
  if (!confirm('Clear all entries for ' + label + '?')) return;
  saveDayLog(MEALS.map(m => ({meal:m, entries:[]})), currentDateOffset);
  renderAll();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('today-view').style.display = tab === 'today' ? '' : 'none';
  document.getElementById('history-view').style.display = tab === 'history' ? '' : 'none';
  if (tab === 'history') renderHistory();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return String(s).replace(/'/g,"\\'"); }

function renderAll() { renderHeader(); currentTab === 'today' ? renderToday() : renderHistory(); }
renderAll();
</script>
