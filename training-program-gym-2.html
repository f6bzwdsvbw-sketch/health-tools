<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Training Program</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #181818; --surface2: #1e1e1e;
    --border: #242424; --border2: #2e2e2e; --text: #f0f0f0;
    --muted: #888; --dim: #555; --dimmer: #333;
    --blue: #4a9eff; --green: #52c97a; --amber: #f0a830;
    --purple: #c97adb; --red: #e05252;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; min-height: 100vh; padding-bottom: 80px; font-size: 14px; line-height: 1.5; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 16px 16px; position: sticky; top: 0; z-index: 20; }
  .header-inner { max-width: 540px; margin: 0 auto; }
  .eyebrow { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; }
  .week-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .week-tab { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); font-size: 12px; font-family: inherit; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
  .week-tab.active { background: var(--green); border-color: var(--green); color: #000; font-weight: 600; }
  .main { max-width: 540px; margin: 0 auto; padding: 16px 16px 0; }
  .phase-banner { background: var(--surface2); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; border-left: 3px solid var(--green); }
  .phase-title { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 4px; }
  .phase-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .schedule { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .schedule-day { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 4px; text-align: center; }
  .schedule-day.active-day { border-color: var(--green); }
  .schedule-day.rest-day { opacity: 0.5; }
  .sd-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .sd-type { font-size: 10px; font-weight: 600; }
  .schedule-day.active-day .sd-type { color: var(--green); }
  .schedule-day.rest-day .sd-type { color: var(--dim); }
  .day-section { margin-bottom: 24px; }
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .day-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 3px 10px; border-radius: 3px; }
  .day-tag.push { background: var(--blue); color: #fff; }
  .day-tag.pull { background: var(--purple); color: #fff; }
  .day-tag.legs { background: var(--amber); color: #000; }
  .day-tag.upper { background: var(--green); color: #000; }
  .day-tag.posterior { background: var(--red); color: #fff; }
  .day-title { font-size: 16px; font-weight: 700; }
  .exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .exercise-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; user-select: none; }
  .exercise-header:hover { background: #1c1c1c; }
  .ex-left { flex: 1; }
  .ex-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .ex-sets { font-size: 12px; color: var(--muted); }
  .ex-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 12px; }
  .ex-done { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border2); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; transition: all 0.15s; flex-shrink: 0; }
  .ex-done.checked { background: var(--green); border-color: var(--green); color: #000; }
  .chevron { color: var(--dim); font-size: 10px; }
  .exercise-body { border-top: 1px solid var(--border); padding: 12px 14px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .note { background: var(--surface2); border-radius: 5px; padding: 8px 10px; margin-top: 8px; font-size: 12px; color: var(--dim); border-left: 2px solid var(--border2); }
  .note.warn { border-left-color: var(--amber); color: var(--amber); }
  .set-log { margin-top: 10px; }
  .set-log-title { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .set-label { font-size: 12px; color: var(--dim); width: 36px; flex-shrink: 0; }
  .set-input { background: #111; border: 1px solid var(--border2); border-radius: 5px; color: var(--text); padding: 6px 8px; font-size: 13px; width: 70px; font-family: inherit; outline: none; text-align: center; }
  .set-input:focus { border-color: var(--green); }
  .set-x { color: var(--dim); font-size: 12px; }
  .set-check { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border2); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; flex-shrink: 0; }
  .set-check.done { background: var(--green); border-color: var(--green); color: #000; }
  .progress-bar-wrap { background: var(--surface2); border-radius: 4px; height: 4px; margin-top: 10px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.3s ease; }
  .progress-label { font-size: 11px; color: var(--dim); margin-top: 4px; text-align: right; }
  .notes-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 8px; }
  .notes-title { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .notes-input { width: 100%; background: #111; border: 1px solid var(--border2); border-radius: 6px; color: var(--text); padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; resize: vertical; min-height: 70px; line-height: 1.5; }
  .notes-input:focus { border-color: var(--green); }
  .notes-input::placeholder { color: var(--dimmer); }
  .save-btn { background: var(--green); border: none; border-radius: 6px; color: #000; font-size: 12px; font-weight: 700; padding: 8px 16px; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .saved-msg { font-size: 12px; color: var(--green); margin-top: 6px; display: none; }
  .section-divider { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin: 16px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="eyebrow">Due Season</div>
    <h1>Gym Training Program</h1>
    <div class="week-tabs" id="week-tabs"></div>
  </div>
</div>

<div class="main" id="main"></div>

<script>
const STORAGE_KEY = 'gym_training_v3';

const PHASES = [
  { week: 1, label: 'Week 1', phase: 'Build', desc: 'Working weights from your previous cycle are your new baseline. RPE ceiling is 7-8 — finish every set feeling like you had 2-3 reps left. This is intentional. Training for longevity means leaving something in the tank consistently.' },
  { week: 2, label: 'Week 2', phase: 'Build', desc: 'Add weight or reps wherever you can. Small jumps — 5lbs upper body, 10lbs lower body. Keep the RPE ceiling at 7-8.' },
  { week: 3, label: 'Week 3', phase: 'Build', desc: 'Push for new bests on key lifts. RPE can touch 8-9 on top sets this week only. Note what you hit — these become your Week 1 baseline next cycle.' },
  { week: 4, label: 'Week 4', phase: 'Deload', desc: 'Drop volume by 40%, reduce weight by 20%, cut to 2 sets per exercise. Non-negotiable. Your joints need this, especially your knees. You will come back stronger for it.' },
];

const SCHEDULE = [
  { label: 'Mon', type: 'push', text: 'Push' },
  { label: 'Tue', type: 'pull', text: 'Pull' },
  { label: 'Wed', type: 'legs', text: 'Legs' },
  { label: 'Thu', type: 'upper', text: 'Upper' },
  { label: 'Fri', type: 'posterior', text: 'Post' },
  { label: 'Sat', type: 'rest', text: 'Rest' },
  { label: 'Sun', type: 'rest', text: 'Rest' },
];

const DAYS = [
  {
    id: 'push',
    label: 'Monday',
    type: 'push',
    title: 'Push — Chest, Shoulders, Triceps',
    sections: [
      { title: 'Warm-Up', exercises: [
        { id: 'push_warmup', name: 'Cable External Rotation', sets: '2×15 each side — light', desc: 'Cable at elbow height. Elbow pinned at side, rotate forearm outward against resistance. Slow and controlled both ways. Keep it light — this is activation, not training.', note: 'Do this before any pressing. Two minutes of rotator cuff activation is the best insurance policy you have for your right shoulder long term.', warn: null },
      ]},
      { title: 'Primary', exercises: [
        { id: 'db_press', name: 'Dumbbell Bench Press', sets: '3×10–12 — RPE 7-8', desc: 'Lie flat, dumbbells at chest level, elbows at ~45°. Press up and slightly together. 3-count descent. Finish each set feeling like you had 2-3 reps left.', note: 'Primary horizontal push. Dumbbells let your shoulder find its natural path — keep it this way permanently.', warn: null },
        { id: 'ohp', name: 'Seated Dumbbell Shoulder Press', sets: '3×10–12 — RPE 7-8', desc: 'Seated, back supported. Dumbbells at ear height, press overhead. Full lockout at top, 3-count descent.', note: 'Seated removes lower back from the equation and keeps blood pressure response more controlled than standing overhead pressing.', warn: 'Right shoulder: if overhead pressing causes discomfort, stop just before full lockout. If that still bothers it, drop to lateral raises instead.' },
      ]},
      { title: 'Cable Chest Isolation', exercises: [
        { id: 'cable_upper_fly', name: 'Cable Upper Pec Fly', sets: '3×12–15', desc: 'Set cables low, handles at hip height. Stand centered between the cables, slight forward lean. With a slight bend in your elbows, bring your hands up and together in an arc finishing at chest height. Squeeze at the top. Slow return. This is the movement that hits upper pec the way incline pressing would.', note: 'Keep the movement smooth and controlled. The upper pec is being stretched at the bottom and contracted at the top — feel both ends of the range.', warn: null },
        { id: 'cable_lower_fly', name: 'Cable Lower Pec Fly', sets: '3×12–15', desc: 'Set cables high, handles at shoulder height or above. Stand centered, slight forward lean. Bring your hands down and together in an arc finishing at your hips. Squeeze at the bottom. Slow return. Isolates lower pec the way a decline press would.', note: 'These two cable fly variations together replace the incline press and give you cleaner pec isolation than any pressing movement.', warn: null },
      ]},
      { title: 'Accessories', exercises: [
        { id: 'lateral_raise', name: 'Dumbbell Lateral Raise', sets: '3×15 — RPE 6', desc: 'Standing, light dumbbells. Raise arms out to shoulder height, lead with elbows. Controlled return.', note: null, warn: 'Stop at shoulder height. Right shoulder: if any pain, skip and add another set of cable external rotation.' },
        { id: 'cable_ext_rot_acc', name: 'Cable External Rotation', sets: '3×15 each side', desc: 'Same as warm-up but slightly more resistance. Elbow pinned at side, rotate outward. Slow both ways.', note: 'Shoulder stability work. Never skip this on push day.', warn: null },
        { id: 'tricep_pushdown', name: 'Cable Tricep Pushdown', sets: '3×12–15', desc: 'Rope or straight bar. Elbows pinned at sides, extend fully, squeeze at the bottom. Slow return.', note: null, warn: null },
        { id: 'overhead_ext', name: 'Overhead Cable Tricep Extension', sets: '3×12', desc: 'Face away from cable, rope overhead. Extend arms forward from elbow. Keep upper arms still.', note: null, warn: null },
      ]},
    ]
  },
  {
    id: 'pull',
    label: 'Tuesday',
    type: 'pull',
    title: 'Pull — Back, Biceps',
    sections: [
      { title: 'Primary', exercises: [
        { id: 'bent_row', name: 'Barbell Bent-Over Row', sets: '3×10–12 — RPE 7-8', desc: 'Overhand grip, hip hinge to ~45°, row to your lower chest. 3-count descent. Squeeze your shoulder blades at the top.', note: null, warn: null },
        { id: 'pulldown', name: 'Lat Pulldown', sets: '3×10–12 — RPE 7-8', desc: 'Wide overhand grip. Pull to upper chest, lead with elbows, lean back slightly. Squeeze lats at bottom. 3-count return.', note: null, warn: null },
        { id: 'seated_row', name: 'Seated Cable Row', sets: '3×10–12 — RPE 7-8', desc: 'V-bar or wide grip. Row to your lower chest, elbows back, squeeze shoulder blades. Controlled return — feel the stretch at the front.', note: null, warn: null },
      ]},
      { title: 'Stability & Accessories', exercises: [
        { id: 'face_pull', name: 'Face Pull', sets: '3×20 — RPE 6', desc: 'Cable at face height, rope attachment. Pull toward your face, elbows high and flared, hands ending near your ears. Squeeze rear delts and rotator cuff hard at the end.', note: 'Shoulder health and postural work. Every pull day and every upper day. High reps, light weight.', warn: null },
        { id: 'cable_row_single', name: 'Single-Arm Cable Row', sets: '3×12 each side', desc: 'Low cable, single handle. Row to your hip, keeping your torso square. Full stretch at the front. Resisting rotation on each rep builds core and rotational stability.', note: null, warn: null },
        { id: 'upright_row', name: 'Upright Row', sets: '3×12', desc: 'Barbell or EZ bar. Pull to chin height, elbows leading and flaring out. Controlled descent.', note: null, warn: null },
        { id: 'db_curl', name: 'Dumbbell Curl', sets: '3×12', desc: 'Alternate arms. Full range, no swinging. Supinate as you curl. Squeeze at top.', note: null, warn: null },
        { id: 'hammer_curl', name: 'Hammer Curl', sets: '3×12', desc: 'Neutral grip throughout. Hits brachialis and forearms in addition to biceps.', note: null, warn: null },
        { id: 'barbell_curl', name: 'Barbell Curl', sets: '3×10', desc: 'Straight bar or EZ bar. Elbows pinned. Full range. No swinging.', note: null, warn: null },
      ]},
    ]
  },
  {
    id: 'legs',
    label: 'Wednesday',
    type: 'legs',
    title: 'Legs — Squat Focus',
    sections: [
      { title: 'Warm-Up', exercises: [
        { id: 'leg_warmup', name: 'Goblet Squat Warm-Up', sets: '2×10 — very light, focus on depth and range', desc: 'Light dumbbell at chest. 4-count descent, pause at the bottom, stand up. This is mobility work — not training. Take your time.', note: 'Best hip and ankle mobility drill that requires no extra space or equipment. Always do this before loading the bar.', warn: null },
      ]},
      { title: 'Primary', exercises: [
        { id: 'squat', name: 'Barbell Back Squat', sets: '3×10 — RPE 7-8', desc: 'Bar on upper traps or rear delts. Feet shoulder-width, toes slightly out. 3-count descent. Drive through heels to stand. Work within your knee comfort on depth.', note: '3×10 keeps time under tension high while managing joint load. Your knees respond better here than to heavier lower-rep work.', warn: 'Knees: 3-count descent every rep. If pain increases past your baseline, reduce depth before reducing weight.' },
        { id: 'rdl', name: 'Romanian Deadlift', sets: '3×10–12 — RPE 7-8', desc: 'Barbell. Hip hinge — push hips back, slight knee bend, back flat. Lower until strong hamstring stretch. Drive hips forward to stand. Bar stays close to your legs.', note: null, warn: null },
      ]},
      { title: 'Accessories', exercises: [
        { id: 'leg_press', name: 'Leg Press', sets: '3×12 — RPE 7', desc: 'Feet shoulder-width on platform. Lower until knees reach ~90°. Press through heels. Don\'t lock out completely at top.', note: null, warn: null },
        { id: 'single_leg_press', name: 'Single-Leg Press', sets: '3×10 each leg — RPE 7', desc: 'Same machine, one leg at a time. Same mechanics — controlled descent, press through heel. Note any difference in strength between legs.', note: 'Stay on the machine while you\'re already set up. Unilateral work catches imbalances fast. If one leg is notably weaker, give it an extra set.', warn: 'Knees: same controlled descent as bilateral. Don\'t rush the lowering phase.' },
        { id: 'ghd_glute', name: 'GHD Glute Raise', sets: '3×12', desc: 'Hips at pad edge. Lower torso by hinging at the hip, squeeze glutes to return to horizontal. Keep back flat — horizontal is your endpoint, not beyond.', note: null, warn: 'Do NOT go into spinal hyperextension. Horizontal only.' },
        { id: 'leg_extension', name: 'Leg Extension', sets: '3×12–15', desc: 'Full range — let the weight lower your legs completely, extend to full lockout at top. Squeeze quads hard at the top. Slow return.', note: 'Quad isolation after squats and leg press. Keeps constant tension on the quad through the full range.', warn: null },
        { id: 'abductor', name: 'Hip Abductor Machine', sets: '3×15', desc: 'Seated, push knees outward against resistance. Full range, controlled return.', note: 'Weak abductors contribute directly to knee tracking issues. This is as much knee rehab as it is glute work.', warn: null },
        { id: 'adductor', name: 'Hip Adductor Machine', sets: '3×15', desc: 'Seated, squeeze knees inward. Full range, controlled return. Superset with abductor — same machine, flip the pad.', note: 'Carries over to your sumo deadlift. Inner thigh strength is a limiter on wide-stance pulling.', warn: null },
        { id: 'calf_raise_standing', name: 'Standing Calf Raise', sets: '4×15', desc: 'Full range — heel below step at bottom, full extension at top. Pause at top. Slow descent.', note: null, warn: null },
      ]},
    ]
  },
  {
    id: 'upper',
    label: 'Thursday',
    type: 'upper',
    title: 'Upper Body — Balanced Volume',
    sections: [
      { title: 'Push', exercises: [
        { id: 'db_press_b', name: 'Dumbbell Bench Press', sets: '3×10 — RPE 7', desc: 'Same as Monday. Match Monday\'s weight, don\'t exceed it — this is your second push session of the week.', note: null, warn: null },
        { id: 'arnold_press', name: 'Arnold Press', sets: '3×10–12 — RPE 7', desc: 'Start with dumbbells at chin height, palms facing you. Rotate palms to face forward as you press. Reverse on the way down. Hits all three delt heads.', note: null, warn: null },
      ]},
      { title: 'Pull', exercises: [
        { id: 'pullup', name: 'Pull-ups or Assisted Pull-ups', sets: '3×max — RPE 7-8', desc: 'Overhand, shoulder-width or wider. Full hang at bottom, chin over bar. Use assisted machine if needed.', note: 'Track your reps week to week. One of the clearest indicators of functional upper body strength improving.', warn: null },
        { id: 'db_row_b', name: 'Dumbbell Row', sets: '3×10–12 each side — RPE 7', desc: 'One knee on bench, row dumbbell to your hip. Back flat. Pull with your elbow, not your hand.', note: null, warn: null },
        { id: 'face_pull_b', name: 'Face Pull', sets: '3×20', desc: 'Same as Tuesday. Cable at face height, rope, elbows high. Shoulder maintenance — never skip it.', note: null, warn: null },
        { id: 'cable_pullover', name: 'Cable Straight-Arm Pullover', sets: '3×12', desc: 'High cable, straight bar or rope. Stand facing cable, slight forward lean. Arms straight, pull bar down to hips in a sweeping arc. Squeeze lats at bottom. Slow return.', note: 'Lat and shoulder stability work. Arms stay straight throughout, removing biceps from the movement.', warn: null },
      ]},
      { title: 'Arms', exercises: [
        { id: 'ez_curl', name: 'EZ Bar Curl', sets: '3×12', desc: 'EZ bar takes pressure off wrists. Full range, controlled.', note: null, warn: null },
        { id: 'skullcrusher', name: 'EZ Bar Skullcrusher', sets: '3×12', desc: 'Lying on bench, lower EZ bar toward forehead by bending at elbows. Press back up. Keep upper arms vertical.', note: null, warn: null },
        { id: 'cable_curl', name: 'Cable Curl', sets: '3×12', desc: 'Low cable, straight or EZ bar. Keeps constant tension through the whole range.', note: null, warn: null },
      ]},
    ]
  },
  {
    id: 'posterior',
    label: 'Friday',
    type: 'posterior',
    title: 'Posterior Chain — Deadlift Focus',
    sections: [
      { title: 'Primary', exercises: [
        { id: 'sumo_dl', name: 'Sumo Deadlift', sets: '3×8 — RPE 7-8', desc: 'Wide stance, toes out ~45°. Grip inside legs. More upright torso than conventional, more hip and inner thigh involvement. Push the floor apart as you pull.', note: 'Your stronger pull. This is the primary movement of the day — treat it accordingly.', warn: null },
        { id: 'rdl_friday', name: 'Romanian Deadlift', sets: '3×10 — RPE 7', desc: 'Barbell. Same as Wednesday — hip hinge, flat back, bar close to legs. Coming after sumo deadlifts your hamstrings are already warm, so keep the weight slightly lower than Wednesday.', note: 'Your son loves these. Do them together.', warn: null },
      ]},
      { title: 'Accessories', exercises: [
        { id: 'leg_curl_fri', name: 'Lying Leg Curl', sets: '4×12 — last set 4-count eccentric', desc: 'Full range both ways. On your final set, lower with a 4-count descent on every rep. The slow eccentric is where hamstring development happens — don\'t rush it.', note: null, warn: null },
        { id: 'ghd_back_ext', name: 'GHD Back Extension', sets: '3×12', desc: 'Position yourself face-down with hips at the pad. Lower your torso toward the floor, then raise back up past horizontal into a controlled hyperextension. Squeeze glutes and spinal erectors at the top.', note: 'Complements the sumo deadlift directly — same spinal erector and hamstring demand, different loading pattern. This is the GHD movement that goes past horizontal, unlike the glute raise on Wednesday.', warn: null },
        { id: 'seated_calf', name: 'Seated Calf Raise', sets: '4×15', desc: 'Full range — all the way down, all the way up. Seated hits the soleus more than standing calf raises. Do both across the week.', note: null, warn: null },
      ]},
    ]
  },
];

let currentWeek = 1;
let expandedExercises = new Set();

function getStorage() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function saveStorage(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function weekKey() { return `week${currentWeek}`; }
function getWeekData() { const s = getStorage(); if (!s[weekKey()]) s[weekKey()] = {}; return s[weekKey()]; }
function saveWeekData(d) { const s = getStorage(); s[weekKey()] = d; saveStorage(s); }
function getExData(dayId, exId) { const w = getWeekData(); if (!w[dayId]) w[dayId] = {}; if (!w[dayId][exId]) w[dayId][exId] = { done: false, sets: [] }; return w[dayId][exId]; }
function saveExData(dayId, exId, data) { const w = getWeekData(); if (!w[dayId]) w[dayId] = {}; w[dayId][exId] = data; saveWeekData(w); }

function renderWeekTabs() {
  document.getElementById('week-tabs').innerHTML = PHASES.map(p =>
    `<button class="week-tab ${p.week===currentWeek?'active':''}" onclick="setWeek(${p.week})">${p.label}</button>`
  ).join('');
}

function renderMain() {
  const phase = PHASES.find(p => p.week === currentWeek);
  const main = document.getElementById('main');
  let html = `
    <div class="phase-banner">
      <div class="phase-title">Phase: ${phase.phase}</div>
      <div class="phase-desc">${phase.desc}</div>
    </div>
    <div class="schedule">
      ${SCHEDULE.map(d => `<div class="schedule-day ${d.type==='rest'?'rest-day':'active-day'}"><div class="sd-label">${d.label}</div><div class="sd-type">${d.text}</div></div>`).join('')}
    </div>`;

  DAYS.forEach(day => {
    const weekData = getWeekData();
    const dayData = weekData[day.id] || {};
    const allEx = day.sections.flatMap(s => s.exercises);
    const completedCount = allEx.filter(ex => (dayData[ex.id]||{}).done).length;
    const pct = Math.round((completedCount / allEx.length) * 100);

    html += `<div class="day-section">
      <div class="day-header">
        <span class="day-tag ${day.type}">${day.label}</span>
        <span class="day-title">${day.title}</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${completedCount}/${allEx.length} exercises logged</div>
      <div style="margin-top:10px;">`;

    day.sections.forEach(section => {
      html += `<div class="section-divider">${section.title}</div>`;
      section.exercises.forEach(ex => { html += renderExercise(day.id, ex); });
    });

    html += `</div>
      <div class="notes-section">
        <div class="notes-title">Session notes — ${day.title}</div>
        <textarea class="notes-input" id="notes-${day.id}" placeholder="Weights used, how it felt, what to adjust next session...">${(dayData._notes||'')}</textarea>
        <button class="save-btn" onclick="saveNotes('${day.id}')">Save notes</button>
        <div class="saved-msg" id="saved-${day.id}">Saved ✓</div>
      </div>
    </div>`;
  });

  main.innerHTML = html;
}

function renderExercise(dayId, ex) {
  const data = getExData(dayId, ex.id);
  const isOpen = expandedExercises.has(dayId+'_'+ex.id);
  const numSets = parseInt(ex.sets.match(/(\d+)×/)?.[1]||'3');
  const setsHtml = Array.from({length:numSets},(_,i) => {
    const set = data.sets[i]||{weight:'',reps:'',done:false};
    return `<div class="set-row">
      <span class="set-label">Set ${i+1}</span>
      <input class="set-input" type="number" placeholder="lbs" value="${set.weight||''}" onchange="updateSet('${dayId}','${ex.id}',${i},'weight',this.value)"/>
      <span class="set-x">×</span>
      <input class="set-input" type="number" placeholder="reps" value="${set.reps||''}" onchange="updateSet('${dayId}','${ex.id}',${i},'reps',this.value)"/>
      <button class="set-check ${set.done?'done':''}" onclick="toggleSet('${dayId}','${ex.id}',${i})">✓</button>
    </div>`;
  }).join('');

  return `<div class="exercise-card">
    <div class="exercise-header" onclick="toggleEx('${dayId}','${ex.id}')">
      <div class="ex-left">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-sets">${ex.sets}</div>
      </div>
      <div class="ex-right">
        <button class="ex-done ${data.done?'checked':''}" onclick="event.stopPropagation();toggleExDone('${dayId}','${ex.id}')">✓</button>
        <span class="chevron">${isOpen?'▲':'▼'}</span>
      </div>
    </div>
    ${isOpen?`<div class="exercise-body">
      <div>${ex.desc}</div>
      ${ex.note?`<div class="note">${ex.note}</div>`:''}
      ${ex.warn?`<div class="note warn">⚠ ${ex.warn}</div>`:''}
      <div class="set-log"><div class="set-log-title">Log your sets</div>${setsHtml}</div>
    </div>`:''}
  </div>`;
}

function setWeek(w) { currentWeek=w; expandedExercises.clear(); renderWeekTabs(); renderMain(); }
function toggleEx(dayId,exId) { const k=dayId+'_'+exId; expandedExercises.has(k)?expandedExercises.delete(k):expandedExercises.add(k); renderMain(); }
function toggleExDone(dayId,exId) { const d=getExData(dayId,exId); d.done=!d.done; saveExData(dayId,exId,d); renderMain(); }
function updateSet(dayId,exId,idx,field,value) { const d=getExData(dayId,exId); if(!d.sets[idx]) d.sets[idx]={weight:'',reps:'',done:false}; d.sets[idx][field]=value; saveExData(dayId,exId,d); }
function toggleSet(dayId,exId,idx) { const d=getExData(dayId,exId); if(!d.sets[idx]) d.sets[idx]={weight:'',reps:'',done:false}; d.sets[idx].done=!d.sets[idx].done; saveExData(dayId,exId,d); renderMain(); }
function saveNotes(dayId) { const val=document.getElementById('notes-'+dayId)?.value||''; const w=getWeekData(); if(!w[dayId]) w[dayId]={}; w[dayId]._notes=val; saveWeekData(w); const msg=document.getElementById('saved-'+dayId); if(msg){msg.style.display='block';setTimeout(()=>msg.style.display='none',2000);} }

renderWeekTabs();
renderMain();
</script>
</body>
</html>
